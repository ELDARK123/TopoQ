[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topoq"
version = "0.1.0"
description = "Topology-aware scheduling for hybrid quantum-classical computing systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TopoQ authors" }]
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
test = []

[tool.setuptools]
packages = ["topoq"]

[tool.setuptools.package-data]
topoq = ["*.json"]
